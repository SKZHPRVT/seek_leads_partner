<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="full-screen" content="yes" />
    <meta name="theme-color" content="#ffffff" />
    <title>Тринити Партнер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--tg-theme-bg-color, #ffffff);
        position: fixed;
        inset: 0;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        transition: background 0.3s ease;
      }
      #root {
        width: 100%;
        height: 100%;
        position: fixed;
        inset: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        background: var(--tg-theme-bg-color, #ffffff);
      }
    </style>
    <script>
      (function() {
        const tg = window.Telegram?.WebApp;
        if (!tg) return;
        
        console.log('[Bootstrap] Telegram WebApp found, version:', tg.version);
        
        try {
          if (tg.ready) tg.ready();
          if (tg.expand) tg.expand();
          if (tg.requestFullscreen) tg.requestFullscreen();
          if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
          
          // === АДАПТАЦИЯ ПОД ТЕМУ TELEGRAM ===
          // Устанавливаем цвет шапки и фона в зависимости от темы
          const bgColor = tg.themeParams?.bg_color || '#ffffff';
          const headerColor = tg.themeParams?.secondary_bg_color || bgColor;
          
          if (tg.setHeaderColor) tg.setHeaderColor(headerColor);
          if (tg.setBackgroundColor) tg.setBackgroundColor(bgColor);
          
          // Обновляем CSS-переменные для темной/светлой темы
          document.documentElement.style.setProperty('--tg-theme-bg-color', bgColor);
          document.documentElement.style.setProperty('--tg-theme-secondary-bg-color', tg.themeParams?.secondary_bg_color || '#f3f4f6');
          document.documentElement.style.setProperty('--tg-theme-text-color', tg.themeParams?.text_color || '#000000');
          document.documentElement.style.setProperty('--tg-theme-hint-color', tg.themeParams?.hint_color || '#999999');
          document.documentElement.style.setProperty('--tg-theme-button-color', tg.themeParams?.button_color || '#2563eb');
          document.documentElement.style.setProperty('--tg-theme-button-text-color', tg.themeParams?.button_text_color || '#ffffff');
          
          // Меняем цвет meta-тега theme-color (для Safari/Chrome)
          const metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) {
            metaTheme.setAttribute('content', bgColor);
          }
          
          // Обработка смены темы на лету
          if (tg.onEvent) {
            tg.onEvent('themeChanged', () => {
              const newBg = tg.themeParams?.bg_color || '#ffffff';
              document.documentElement.style.setProperty('--tg-theme-bg-color', newBg);
              if (metaTheme) metaTheme.setAttribute('content', newBg);
            });
          }
        } catch (e) {
          console.warn('[Bootstrap] TG API error:', e);
        }

        // Форс-ресайз (как в Data Scientist)
        let _maxH = window.innerHeight;
        const forceResize = () => {
          _maxH = Math.max(_maxH, window.innerHeight);
          const h = _maxH;
          document.documentElement.style.height = h + 'px';
          document.body.style.height = h + 'px';
        };
        window.addEventListener('resize', forceResize);
        window.addEventListener('orientationchange', () => {
          setTimeout(forceResize, 100);
          setTimeout(forceResize, 500);
        });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', forceResize);
        }
        forceResize();
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
