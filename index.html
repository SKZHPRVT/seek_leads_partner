<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="full-screen" content="yes" />
    <meta name="theme-color" content="#000000" />
    <title>Тринити Партнер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        position: fixed;
        inset: 0;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #root {
        width: 100%;
        height: 100%;
        position: fixed;
        inset: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        background: var(--tg-theme-bg-color, #ffffff);
      }
    </style>
    <script>
      // Агрессивный запуск Telegram API как в Data Scientist
      (function() {
        const tg = window.Telegram?.WebApp;
        if (!tg) return;
        
        console.log('[Bootstrap] Telegram WebApp found, version:', tg.version);
        
        try {
          if (tg.ready) tg.ready();
          if (tg.expand) tg.expand();
          if (tg.requestFullscreen) tg.requestFullscreen();
          if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
          if (tg.setHeaderColor) tg.setHeaderColor('#000000');
          if (tg.setBackgroundColor) tg.setBackgroundColor('#000000');
        } catch (e) {
          console.warn('[Bootstrap] TG API error:', e);
        }

        // Форс-ресайз
        let _maxH = window.innerHeight;
        const forceResize = () => {
          _maxH = Math.max(_maxH, window.innerHeight);
          const h = _maxH;
          document.documentElement.style.height = h + 'px';
          document.body.style.height = h + 'px';
        };
        window.addEventListener('resize', forceResize);
        window.addEventListener('orientationchange', () => {
          setTimeout(forceResize, 100);
          setTimeout(forceResize, 500);
        });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', forceResize);
        }
        forceResize();
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
